services:
  tests:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    working_dir: /work
    volumes: ['.:/work', 'test_modules:/work/node_modules', 'test_next:/work/.next-e2e']
    environment: { CI: 'true' }
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm e2e"
volumes:
  test_modules:
  test_next:
