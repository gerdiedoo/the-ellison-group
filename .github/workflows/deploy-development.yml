name: Development image
on:
  push:
    branches: [development]
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:development
          build-args: |
            NEXT_PUBLIC_APP_ENV=development
            NEXT_PUBLIC_DATA_MODE=mock
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            GIT_SHA=${{ github.sha }}
      - name: Trigger host deployment when configured
        env: { DEPLOY_HOOK: '${{ secrets.DEPLOY_HOOK }}' }
        run: 'if [ -n "$DEPLOY_HOOK" ]; then curl --fail --request POST "$DEPLOY_HOOK"; else echo "Image published. Configure development DEPLOY_HOOK to update your host."; fi'
